# Isolated test stack — Postgres + Redis only.
# Usage: docker compose -f docker-compose.test.yml up -d --wait
# Teardown: docker compose -f docker-compose.test.yml down -v
services:
  postgres:
    image: postgres:16-alpine
    container_name: securi-test-postgres
    environment:
      POSTGRES_USER: securi_test
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: securi_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securi_test -d securi_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: securi-test-redis
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
