services:
  - type: web
    name: securi-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SERVER_URL
        value: https://securi-backend.onrender.com
      - key: FRONTEND_URL
        value: https://securi-frontend.onrender.com
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: AI_ASSISTANT_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: local
    healthCheckPath: /health/live
    autoDeploy: true
    plan: starter

  - type: web
    name: securi-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://securi-backend.onrender.com
      - key: NODE_ENV
        value: production
    healthCheckPath: /
    autoDeploy: true
    plan: starter

databases:
  - name: securi-db
    databaseName: securi
    user: securi
    plan: starter
    ipAllowList:
      - source: 0.0.0.0/0

