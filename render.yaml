services:
  - type: web
    name: securi-backend
    runtime: image
    image:
      url: https://github.com/PrashantPatil-2005/Securi_Sphere.git
      dockerfilePath: backend/Dockerfile
      dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: securi-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: securi-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SERVER_URL
        value: https://securi-backend.onrender.com
      - key: FRONTEND_URL
        value: https://securi-frontend.onrender.com
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: ALLOW_REGISTRATION
        value: true
      - key: AI_ASSISTANT_ENABLED
        value: true
      - key: AI_PROVIDER
        value: local
    healthCheckPath: /health/live
    autoDeploy: true
    plan: starter

  - type: web
    name: securi-frontend
    runtime: image
    image:
      url: https://github.com/PrashantPatil-2005/Securi_Sphere.git
      dockerfilePath: frontend/Dockerfile
      dockerContext: .
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://securi-backend.onrender.com
      - key: NODE_ENV
        value: production
    healthCheckPath: /
    autoDeploy: true
    plan: starter

  - type: database
    name: securi-db
    databaseName: securi
    user: securi
    plan: starter
    ipAllowList:
      - name: default
        cidr: 0.0.0.0/0

  - type: redis
    name: securi-redis
    plan: starter
    ipAllowList:
      - name: default
        cidr: 0.0.0.0/0
