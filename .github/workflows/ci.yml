name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run backend unit tests (no DB/Redis required)
        run: pytest tests/ -v --ignore=tests/integration -m "not integration"
        env:
          TESTING: "true"
          REDIS_URL: ""
          JOB_QUEUE_BACKEND: memory
          WS_PUBSUB_BACKEND: memory
          JWT_SECRET: ci-test-secret-key-minimum-length

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: securi_test
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: securi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securi_test -d securi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt redis
      - name: Run all backend tests (PG + Redis available)
        run: pytest tests/ -v --tb=short
        env:
          TESTING: "true"
          DATABASE_URL: postgresql+asyncpg://securi_test:testpass@localhost:5432/securi_test
          JWT_SECRET: ci-test-secret-key-minimum-length
          REDIS_URL: redis://localhost:6379/0
          JOB_QUEUE_BACKEND: redis
          WS_PUBSUB_BACKEND: redis

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check app tests

  backend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit[toml]
      - run: bandit -r app -f json -o bandit-report.json --severity-level medium || true
      - run: bandit -r app --severity-level high

  agent-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Run agent tests
        run: pytest tests/ -v --tb=short

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run frontend unit tests
        run: npm run test:unit
      - name: Typecheck
        run: npx tsc --noEmit

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Start frontend
        run: npm run start -- -p 3000 &
      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/login; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

  e2e-lab:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: securi_test
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: securi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securi_test -d securi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt redis
      - name: Start API server
        working-directory: backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health/ready; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become ready"
          exit 1
        env:
          DATABASE_URL: postgresql+asyncpg://securi_test:testpass@localhost:5432/securi_test
          JWT_SECRET: ci-test-secret-key-minimum-length
          REDIS_URL: redis://localhost:6379/0
          TESTING: "false"
          ENVIRONMENT: development
          ASYNC_EVENT_PIPELINE: "false"
          ALLOW_REGISTRATION: "true"
          ENABLE_SIMULATION: "true"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install chromium --with-deps
      - name: Build and start frontend
        working-directory: frontend
        run: |
          echo "NEXT_PUBLIC_API_URL=http://localhost:8000" > .env.local
          npm run build
          npm run start -- -p 3000 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/login; then exit 0; fi
            sleep 2
          done
          exit 1
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Run SOC lab E2E
        working-directory: frontend
        run: npx playwright test e2e/smoke.spec.ts e2e/lab-flow.spec.ts e2e/invite-flow.spec.ts e2e/offense-promotion.spec.ts e2e/maintenance-flow.spec.ts e2e/intel-crud.spec.ts e2e/threat-scores.spec.ts --workers=1
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_FULL_STACK: "1"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t securi-backend .
      - run: docker build -f frontend/Dockerfile -t securi-frontend .

  container-scan:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t securi-backend .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: securi-backend
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
        continue-on-error: true

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose smoke test
        run: chmod +x scripts/compose-smoke.sh && ./scripts/compose-smoke.sh

  load-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: securi_test
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: securi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securi_test -d securi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt redis
      - name: Start API server
        working-directory: backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health/ready; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become ready"
          exit 1
        env:
          DATABASE_URL: postgresql+asyncpg://securi_test:testpass@localhost:5432/securi_test
          JWT_SECRET: ci-test-secret-key-minimum-length
          REDIS_URL: redis://localhost:6379/0
          TESTING: "false"
          ENVIRONMENT: development
          ASYNC_EVENT_PIPELINE: "false"
      - uses: grafana/setup-k6-action@v1
      - name: Run k6 smoke test
        run: k6 run loadtests/smoke.js
        env:
          BASE_URL: http://localhost:8000
          LOADTEST_EMAIL: loadtest@ci.local
          LOADTEST_PASSWORD: testpass123
